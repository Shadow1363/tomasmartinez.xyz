      <figure class="system-diagram" style="display: none">
        <pre id="system-diagram">
flowchart LR
  visitor([Visitor]) --> site[tomasmartinez.xyz]
  site --> i18n[(settings.json&lt;br/&gt;EN · ES · PT)]
  site --> github[GitHub API&lt;br/&gt;repos tagged tomas-martinez]
  site --> blog[Blog JSON feed]
  github --> vscode[VS Code Marketplace&lt;br/&gt;install counts]
  github --> cards[Project cards]

  blog --> posts[Latest posts]

        <figcaption data-i18n="about.diagram">
